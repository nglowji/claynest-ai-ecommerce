[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claynest-api"
version = "0.1.0"
description = "ClayNest AI modular monolith"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
