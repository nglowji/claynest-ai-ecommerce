name: claynest-ai-ecommerce
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-claynest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/configure.py first}
      POSTGRES_DB: ${POSTGRES_DB:-claynest}
      COMMERCE_DB_PASSWORD: ${COMMERCE_DB_PASSWORD:?Run python scripts/configure.py first}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:?Run python scripts/configure.py first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  db-bootstrap:
    image: pgvector/pgvector:pg17
    profiles: ["app", "test"]
    environment:
      PGHOST: db
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-claynest}
      POSTGRES_DB: ${POSTGRES_DB:-claynest}
      COMMERCE_DB_PASSWORD: ${COMMERCE_DB_PASSWORD}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD}
    volumes:
      - ./infra/postgres:/bootstrap:ro
    entrypoint: ["/bin/sh", "/bootstrap/010-ownership.sh"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    profiles: ["app"]
    build:
      context: ./backend
      target: runtime
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Commerce: Host=db;Port=5432;Database=${POSTGRES_DB:-claynest};Username=commerce_app;Password=${COMMERCE_DB_PASSWORD}
    ports:
      - "127.0.0.1:${COMMERCE_API_PORT:-8000}:8080"
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://localhost:8080/ready"]
      interval: 10s
      timeout: 6s
      retries: 5
    restart: unless-stopped

  ai-service:
    profiles: ["app"]
    build: ./ai-service
    environment:
      AI_DATABASE_URL: postgresql+psycopg://ai_app:${AI_DB_PASSWORD}@db:5432/${POSTGRES_DB:-claynest}
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 5
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

  api-tests:
    profiles: ["test"]
    build:
      context: ./backend
      target: tests
    environment:
      TEST_COMMERCE_CONNECTION: Host=db;Port=5432;Database=${POSTGRES_DB:-claynest};Username=commerce_app;Password=${COMMERCE_DB_PASSWORD}
      TEST_AI_CONNECTION: Host=db;Port=5432;Database=${POSTGRES_DB:-claynest};Username=ai_app;Password=${AI_DB_PASSWORD}
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully

  ai-tests:
    profiles: ["test"]
    build: ./ai-service
    command: ["pytest", "-q"]
    environment:
      AI_DATABASE_URL: postgresql+psycopg://ai_app:${AI_DB_PASSWORD}@db:5432/${POSTGRES_DB:-claynest}
      AI_INTEGRATION_TESTS: "1"
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully

volumes:
  postgres_data:
