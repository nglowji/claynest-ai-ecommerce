name: claynest-ai-ecommerce
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-claynest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/configure.py first}
      POSTGRES_DB: ${POSTGRES_DB:-claynest}
      COMMERCE_DB_PASSWORD: ${COMMERCE_DB_PASSWORD:?Run python scripts/configure.py first}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:?Run python scripts/configure.py first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  db-bootstrap:
    image: pgvector/pgvector:pg17
    profiles: ["app", "test"]
    environment:
      PGHOST: db
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-claynest}
      POSTGRES_DB: ${POSTGRES_DB:-claynest}
      COMMERCE_DB_PASSWORD: ${COMMERCE_DB_PASSWORD}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD}
    volumes:
      - ./infra/postgres:/bootstrap:ro
    entrypoint: ["/bin/sh", "/bootstrap/010-ownership.sh"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    profiles: ["app"]
    build:
      context: ./backend
      target: runtime
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DataProtection__KeysPath: /app/keys
      Catalog__ImagePath: /app/media/catalog
      Ai__BaseUrl: http://ai-service:8001
      Ai__GatewaySecret: ${AI_GATEWAY_SECRET}
      Ai__KnowledgeAdminSecret: ${AI_KNOWLEDGE_ADMIN_SECRET}
      Ai__ToolSecret: ${AI_TOOL_SECRET}
      ConnectionStrings__Commerce: Host=db;Port=5432;Database=${POSTGRES_DB:-claynest};Username=commerce_app;Password=${COMMERCE_DB_PASSWORD}
    volumes:
      - api_keys:/app/keys
      - catalog_images:/app/media/catalog
    ports:
      - "127.0.0.1:${COMMERCE_API_PORT:-8000}:8080"
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://localhost:8080/ready"]
      interval: 10s
      timeout: 6s
      retries: 5
    restart: unless-stopped

  auth-bootstrap:
    profiles: ["setup"]
    image: claynest-ai-ecommerce-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Commerce: Host=db;Port=5432;Database=${POSTGRES_DB:-claynest};Username=commerce_app;Password=${COMMERCE_DB_PASSWORD}
      DataProtection__KeysPath: /app/keys
      Catalog__ImagePath: /app/media/catalog
      Bootstrap__Email: ${ADMIN_EMAIL}
      Bootstrap__Password: ${ADMIN_PASSWORD}
      Bootstrap__DisplayName: ${ADMIN_DISPLAY_NAME:-Quản trị Nàng Gốm}
    volumes:
      - api_keys:/app/keys
      - catalog_images:/app/media/catalog
    command: ["--bootstrap-auth", "--seed-catalog", "--refresh-catalog"]
    depends_on:
      db:
        condition: service_healthy

  ai-service:
    profiles: ["app"]
    build: ./ai-service
    environment:
      AI_DATABASE_URL: postgresql+psycopg://ai_app:${AI_DB_PASSWORD}@db:5432/${POSTGRES_DB:-claynest}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_GEMINI_MODEL: ${AI_GEMINI_MODEL:-gemini-3.5-flash-lite}
      AI_GATEWAY_SECRET: ${AI_GATEWAY_SECRET}
      AI_KNOWLEDGE_ADMIN_SECRET: ${AI_KNOWLEDGE_ADMIN_SECRET}
      AI_TOOL_SECRET: ${AI_TOOL_SECRET}
      AI_COMMERCE_BASE_URL: http://api:8080
      AI_DAILY_TURN_LIMIT: ${AI_DAILY_TURN_LIMIT:-100}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-1024}
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 5
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

  db-test:
    profiles: ["test", "e2e"]
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: test_owner
      POSTGRES_DB: claynest_test
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Run python scripts/configure.py first}
      COMMERCE_DB_PASSWORD: ${TEST_COMMERCE_DB_PASSWORD:?Run python scripts/configure.py first}
      AI_DB_PASSWORD: ${TEST_AI_DB_PASSWORD:?Run python scripts/configure.py first}
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U test_owner -d claynest_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  api-tests:
    profiles: ["test"]
    build:
      context: ./backend
      target: tests
    environment:
      TEST_COMMERCE_CONNECTION: Host=db-test;Port=5432;Database=claynest_test;Username=commerce_app;Password=${TEST_COMMERCE_DB_PASSWORD}
      TEST_AI_CONNECTION: Host=db-test;Port=5432;Database=claynest_test;Username=ai_app;Password=${TEST_AI_DB_PASSWORD}
    depends_on:
      db-test:
        condition: service_healthy

  ai-tests:
    profiles: ["test"]
    build: ./ai-service
    command: ["pytest", "-q", "-p", "no:cacheprovider"]
    environment:
      AI_DATABASE_URL: postgresql+psycopg://ai_app:${TEST_AI_DB_PASSWORD}@db-test:5432/claynest_test
      AI_INTEGRATION_TESTS: "1"
    depends_on:
      db-test:
        condition: service_healthy

  e2e-bootstrap:
    profiles: ["e2e"]
    build:
      context: ./backend
      target: runtime
    environment: &e2e-api-env
      ASPNETCORE_ENVIRONMENT: Development
      DataProtection__KeysPath: /app/keys
      Catalog__ImagePath: /app/media/catalog
      ConnectionStrings__Commerce: Host=db-test;Port=5432;Database=claynest_test;Username=commerce_app;Password=${TEST_COMMERCE_DB_PASSWORD}
      Bootstrap__Email: ${E2E_ADMIN_EMAIL}
      Bootstrap__Password: ${E2E_ADMIN_PASSWORD}
      Bootstrap__DisplayName: E2E administrator
    command: ["--bootstrap-auth", "--seed-catalog", "--refresh-catalog"]
    depends_on:
      db-test:
        condition: service_healthy

  e2e-api:
    profiles: ["e2e"]
    build:
      context: ./backend
      target: runtime
    environment: *e2e-api-env
    ports:
      - "127.0.0.1:18000:8080"
    depends_on:
      e2e-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/ready"]
      interval: 2s
      timeout: 5s
      retries: 30

  frontend-tests:
    profiles: ["e2e"]
    build:
      context: ./frontend
      dockerfile: Dockerfile.e2e
    init: true
    shm_size: 1gb
    environment:
      API_PROXY_TARGET: http://e2e-api:8080
      E2E_ADMIN_EMAIL: ${E2E_ADMIN_EMAIL}
      E2E_ADMIN_PASSWORD: ${E2E_ADMIN_PASSWORD}
    depends_on:
      e2e-api:
        condition: service_healthy

volumes:
  postgres_data:
  api_keys:
  catalog_images:
